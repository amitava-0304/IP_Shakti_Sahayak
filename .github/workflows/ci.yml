name: IP-SHAKTI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile backend/app.py
          python -m py_compile backend/rag.py
          python -m py_compile backend/ingest.py
          python -m py_compile backend/upload_ingest.py
          python -m py_compile backend/map_service.py
          python -m py_compile prepare_data.py

      - name: Import FastAPI application
        env:
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          SERPAPI_API_KEY: ""
          STORAGE_ROOT: "/tmp/ip_shakti_storage"
          AUTO_INGEST_ON_START: "false"
          REBUILD_MAIN_ON_START: "false"
        run: python -c "from backend.app import app; print(app.title)"

      - name: Build Docker image
        run: docker build -t ip-shakti-sahayak .
